<!doctype html><html lang="ja" data-online-ui="new" data-battle-ui="a" data-a-version="v2"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122c29"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>オンライン対戦 β · 蟲神器</title><link rel="stylesheet" href="css/battle.css?v=ui-a-v2-1"><link rel="stylesheet" href="css/design-system.css?v=ui-a-v2-1"><link rel="stylesheet" href="online/online.css?v=ui-a-v2-1"><link rel="stylesheet" href="battle-ui/new-ui.css?v=ui-a-v2-1"></head>
<body class="online-screen"><main id="online-app" class="battle-shell">
<header class="online-header"><a data-ui-choice="legacy" href="online.html">旧UIへ</a><strong>オンライン対戦 新UI</strong><span id="connection" role="status">接続準備中</span><button id="menu" type="button">メニュー</button></header>
<p id="notice" role="status" aria-live="polite"></p>
<section id="entrance" class="online-panel"><h1>離れた場所で、同じ戦場へ。</h1><p>ルーム番号を共有して対戦・観戦できます。</p><label>表示名<input id="name" maxlength="24" value="プレイヤー" autocomplete="nickname"></label><p id="preferred-deck" role="status"></p><button id="create" disabled type="button">新しいルームを作る</button><label>ルーム番号<input id="code" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="off" spellcheck="false"></label><button id="join" disabled type="button">戦う</button><button id="watch" disabled type="button">観る</button><a href="index.html">戻る</a><a href="toolbox.html#decks">図鑑でデッキを準備する →</a></section>
<section id="room" class="online-panel" hidden><h1>ルーム <span id="room-code"></span></h1><button id="copy-code" type="button">番号をコピー</button><p id="participants"></p><p id="membership" role="status"></p><label id="deck-label">使用デッキ<select id="deck-select"></select></label><p id="deck-readiness" role="status" aria-live="polite"></p><button id="deck-preview" type="button">デッキ内容を確認</button><button id="deck-apply" type="button">このデッキを使う</button><button id="ready" disabled type="button">準備完了</button><button id="leave" type="button">退出</button><p>サーバー再起動時は試合を中断します。</p></section>
<section id="board" hidden aria-label="対戦盤面 新UI"><div id="b-battle"></div></section>
<dialog id="overlay"><div class="online-dialog-head"><h2 id="overlay-title"></h2><button id="close-overlay" type="button">閉じる</button></div><div id="overlay-body"></div></dialog>
</main>
