<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>蟲の図鑑・デッキ | 蟲神器</title>
  <meta name="theme-color" content="#122c29">
  <link rel="stylesheet" href="toolbox/toolbox.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="toolbox/astra-toolbox.css">
</head>
<body>
  <header class="toolbox-header">
    <div>
      <p class="eyebrow">MUSHI JINGI · COLLECTION</p>
      <h1 id="collection-title">蟲の図鑑</h1>
      <p class="subtitle" id="collection-subtitle">一匹ずつ知る。自分だけの組み合わせを見つける。</p>
    </div>
    <a class="collection-home" href="index.html" aria-label="ホームへ">蟲</a>
  </header>

  <main>
    <section id="cards-view" class="app-view" aria-labelledby="cards-heading">
    <section class="controls" aria-label="カード検索とフィルター">
      <label class="search-field">
        <span>カード検索</span>
        <input id="search-input" type="search" placeholder="カード名・カード番号で検索" autocomplete="off">
      </label>
      <details class="filter-panel"><summary>絞り込み・並べ替え <span id="filter-summary">すべてのカード</span></summary><div class="filter-grid">
        <label>弾<select id="set-filter"><option value="">すべて</option></select></label>
        <label>種類<select id="type-filter"><option value="">すべて</option></select></label>
        <label>色<select id="color-filter"><option value="">すべて</option></select></label>
        <label>コスト<select id="cost-filter"><option value="">すべて</option></select></label>
        <label>レアリティ<select id="rarity-filter"><option value="">すべて</option></select></label>
        <label>対戦対応<select id="status-filter"><option value="">すべて</option></select></label>
        <label>並べ替え<select id="sort-select"><option value="officialNumber">カード番号</option><option value="name">名前</option><option value="cost">コスト</option><option value="hp">HP</option></select></label>
      </div>
      <button id="clear-filters" class="clear-button" type="button">条件をクリア</button>
      </details>
    </section>

    <div class="result-heading">
      <h2 id="cards-heading">標本一覧</h2>
      <span id="result-count" aria-live="polite">読込中</span>
    </div>
    <div id="load-error" class="message error-message" hidden></div>
    <div id="empty-message" class="message" hidden>条件に一致するカードはありません。</div>
    <div id="catalog-deck-bar" class="catalog-deck-bar"><span>編集中 <strong id="catalog-deck-name"></strong></span><button type="button" data-view="decks">デッキを見る <b id="catalog-deck-count">0 / 20</b> →</button></div>
    <section id="card-list" class="card-list" aria-label="カード一覧" aria-busy="true"></section>
    </section>

    <section id="decks-view" class="app-view" aria-labelledby="decks-heading" hidden>
      <div class="deck-toolbar">
        <div>
          <p class="section-kicker">デッキ作成</p>
          <h2 id="decks-heading">デッキ</h2>
        </div>
        <button id="new-deck" class="secondary-button" type="button">新規</button>
      </div>

      <section class="deck-editor" aria-label="デッキ編集">
        <label>保存済みデッキ
          <select id="deck-selector"></select>
        </label>
        <label>デッキ名
          <input id="deck-name" type="text" maxlength="80" autocomplete="off">
        </label>
        <div class="deck-actions">
          <button id="save-deck" class="primary-button" type="button">保存</button>
          <button id="duplicate-deck" class="secondary-button" type="button">複製</button>
          <button id="delete-deck" class="danger-button" type="button">削除</button>
          <button id="battle-deck" class="primary-button" type="button">このデッキで対戦</button>
        </div>
        <p id="storage-message" class="storage-message" aria-live="polite"></p>
      </section>

      <section class="deck-summary" aria-label="デッキ統計">
        <div class="total-stat"><strong id="deck-total">0</strong><span>合計枚数</span></div>
        <div id="deck-stats" class="stat-grid"></div>
        <div id="cost-stats" class="cost-stats"></div>
      </section>

      <div class="result-heading">
        <h2>採用カード</h2>
        <span id="deck-entry-count">0種類</span>
      </div>
      <div id="empty-deck-message" class="message">カード画面からカードを追加してください。</div>
      <button type="button" data-view="cards" class="add-from-catalog">＋ 図鑑からカードを選ぶ</button>
      <section id="deck-list" class="deck-list" aria-label="採用カード一覧"></section>
    </section>
  </main>

  <nav class="bottom-nav app-nav" aria-label="メインナビゲーション">
    <a href="index.html"><span class="nav-icon" aria-hidden="true">⌂</span>ホーム</a>
    <button type="button" data-view="cards" class="active" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span><span>蟲の図鑑</span></button>
    <button type="button" data-view="decks"><span class="nav-icon" aria-hidden="true">▱</span><span>デッキ <b id="nav-deck-total">0</b></span></button>
  </nav>

  <dialog id="card-detail" class="detail-dialog" aria-labelledby="detail-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="detail-toolbar">
      <p>カード詳細</p>
      <div><button id="detail-add" class="detail-add" type="button">デッキに追加</button><button id="close-detail" type="button" aria-label="カード詳細を閉じる">閉じる</button></div>
    </div>
    <div id="detail-content" class="detail-content"></div>
  </dialog>

  <div id="collection-toast" class="ui-toast" role="status" aria-live="polite" hidden></div>
  <script src="shared/card-art-manifest.js?v=set8-catalog-v1"></script>
  <script src="shared/card-visuals.js"></script>
  <script src="js/cards/card-definition.js?v=set8-catalog-v1"></script>
  <script src="js/cards/card-registry.js"></script>
  <script src="js/cards/starter-cards.js?v=set8-catalog-v1"></script>
  <script src="js/cards/set1-cards.js"></script>
  <script src="js/cards/full-catalog-data.js?v=set8-catalog-v1"></script>
  <script src="js/cards/set2-cards.js"></script>
  <script src="js/cards/set3-cards.js"></script>
  <script src="js/cards/set4-cards.js"></script>
  <script src="js/cards/catalog-card-loader.js?v=set8-catalog-v1"></script>
  <script>window.MushijingiCatalogCardLoader.registerCatalogDefinitions(window.cardRegistry, window.MushijingiFullCatalogData);</script>
  <script src="shared/card-data/registry-catalog.js?v=set8-catalog-v1"></script>
  <script src="js/ui/card-effect-formatter.js"></script>
  <script src="shared/ui-presenter.js?v=set8-catalog-v1"></script>
  <script src="shared/deck-format/runtime.js"></script>
  <script src="toolbox/toolbox-core.js?v=set8-catalog-v1"></script>
  <script src="toolbox/toolbox-v1-app.js?v=set8-catalog-v1"></script>
</body>
</html>
