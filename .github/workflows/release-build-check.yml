name: Release build verification
on:
  push:
    branches: ['release/online-b-20261031', 'cpu-b-v2-20261031', 'b-responsive-20261031', 'release/cards-366-20261102', 'cards-count-isolation-20261102', 'crossset-next-20261103', 'crossset-dive-20261103', 'crossset-entry-20261103', 'crossset-growth-20261103', 'crossset-entry-wave3-20261103', 'crossset-emergence-20261103', 'crossset-food-wave-20261103']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: node scripts/verify-pages-output.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pages-output
          path: _site
          retention-days: 3
